# CI — lint, typecheck, and unit tests on every push and pull request.
# (Vercel builds and deploys independently; the repo rule is: never merge red.
# The Supabase keep-alive workflow is a separate Wave 5 deliverable.)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint · typecheck · unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test
