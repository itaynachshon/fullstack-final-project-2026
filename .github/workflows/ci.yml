# CI — static/unit checks plus credential-free browser boundaries.
# (Vercel builds and deploys independently; the repo rule is: never merge red.
# The Supabase keep-alive workflow is a separate Wave 5 deliverable.)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Lint · typecheck · unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  e2e-public:
    name: Playwright · public auth boundaries
    needs: checks
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test logged-out boundaries
        run: npm run test:e2e:public
